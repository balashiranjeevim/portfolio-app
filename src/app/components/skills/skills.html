<div class="space-y-8">
  <div class="space-y-3">
    <div
      class="inline-flex items-center gap-2 rounded-full border border-black bg-cyan-100/80 px-4 py-1.5 text-xs font-bold text-cyan-950"
    >
      <app-icon name="code" className="w-4 h-4 text-cyan-900"></app-icon>
      <span>Technical Expertise</span>
    </div>
    <h2 class="font-serif text-3xl font-bold text-blue-950 sm:text-5xl">Skills</h2>
    <p class="max-w-2xl text-base text-slate-600 sm:text-lg">
      A collection of languages, modern web frameworks, databases, and intelligent tools I use to
      build robust applications.
    </p>
  </div>

  <section class="grid grid-cols-1 gap-6 md:grid-cols-2">
    @for (domain of categories; track domain.title) {
      <div class="rounded-2xl border-2 border-black bg-slate-100/80 p-6 shadow-sm">
        <div class="inline-flex items-center gap-3 rounded-xl border border-slate-300 bg-white px-3.5 py-2">
          <div class="rounded-lg bg-cyan-100 p-2 text-cyan-900">
            <app-icon [name]="domain.icon" className="w-5 h-5 text-black"></app-icon>
          </div>
          <h3 class="text-base sm:text-lg font-bold text-slate-900">{{ domain.title }}</h3>
        </div>
        <div class="mt-5 flex flex-wrap gap-2.5">
          @for (skill of domain.skills; track skill.name) {
            <div
              class="inline-flex items-center gap-2 rounded-full border border-black bg-white px-3 py-1.5 text-xs font-medium text-slate-800 shadow-xs transition-colors hover:bg-slate-50"
            >
              <span><app-icon [name]="skill.icon" className="w-3.5 h-3.5"></app-icon></span>
              <span>{{ skill.name }}</span>
            </div>
          }
        </div>
      </div>
    }
  </section>
</div>
